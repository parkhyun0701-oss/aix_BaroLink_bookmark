<!doctype html>
<!-- 담당: 팀원 D · 이슈 #14 · 명세: F12 (화면 배치). 스크립트는 HTML 안에 직접 쓰지 않고 .js 파일에 둔다 (MV3 제한) -->
<!-- 칸마다 그리는 파일이 하나씩 정해져 있다. 각 파일은 자기 칸 안만 그린다 (docs/file-structure.md 12번) -->
<!-- 칸 안의 내용(폴더·북마크·목록)은 담당 .js가 채운다. 여기서는 빈 칸만 둔다. 모양은 확정 시안(docs/design/App.tsx) -->
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>바로링크 · 새 탭</title>
    <link rel="stylesheet" href="newtab.css" />
  </head>
  <body>
    <!-- 배경 장식 (은은한 번짐). 공통 자산이라 뼈대에 둔다 -->
    <div class="bg-decor" aria-hidden="true">
      <span></span>
      <span></span>
      <span></span>
    </div>

    <!-- 아이콘은 ui.js의 icon()이 코드로 그린 SVG를 돌려준다(명세 N46). HTML에 아이콘 묶음(<defs>)을 두지 않는다 -->

    <!-- 뼈대 확인용 문구. render.js가 화면을 그리기 시작하면 지운다 -->
    <p id="skeleton-note">바로링크 (BaroLink) · 뼈대만 있는 상태입니다</p>

    <div class="app">
      <header id="header"></header>                     <!-- render.js: 로고, 이동 버튼, [정리하기], 정리 기록 -->
      <div class="content">
        <main id="app-main">
          <section id="web-search"></section>           <!-- render.js (search.js 사용): 날짜, 웹 검색창 -->
          <section id="organize-suggestion"></section>  <!-- view/cards.js: 첫 정리 카드, 고정 제안 카드 -->
          <section id="my-folders" class="card">        <!-- 내 폴더 구역. 잊고 있던 북마크가 폴더 줄 맨 앞에 온다 (F12-01, 시안) -->
            <div class="folders-row">
              <div id="forgotten-slot"></div>           <!-- view/forgottenFolder.js: 잊고 있던 북마크 (맨 앞) -->
              <div id="folder-list"></div>              <!-- view/folders.js: 내 폴더 줄 -->
            </div>
          </section>
          <section id="all-bookmarks" class="card"></section> <!-- render.js (search.js 사용): 북마크 검색창, 모든 북마크 -->
        </main>
      </div>
    </div>

    <nav id="dock" aria-label="고정 북마크"></nav>       <!-- render.js: 고정됨(독) -->
    <div id="notice"></div>                             <!-- view/history.js: 정리 결과 안내 -->
    <div id="toast" role="status" aria-live="polite"></div> <!-- ui.js: 짧은 안내 문구 -->
    <div id="dialogs"></div>                            <!-- 각 화면 파일이 자기 <dialog>를 여기에 붙인다 -->

    <script type="module" src="js/render.js"></script>
  </body>
</html>
